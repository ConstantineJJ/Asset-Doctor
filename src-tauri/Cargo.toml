[package]
name = "asset-doctor"
version = "0.0.0"
description = "Local 3D asset diagnostics and verified repaired copies"
edition = "2021"
rust-version = "1.90"

[lib]
name = "asset_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
