name: Asset Doctor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-shot compare and health polish
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/one-shot-polish.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Asset Doctor CI"
            git config user.email "asset-doctor-ci@users.noreply.github.com"
            git add src/viewer/CompareSceneManager.ts src/components/CompareInspectorPanel.tsx src/components/InspectorPanel.tsx src/App.tsx
            git commit -m "fix: restore lineup and compact diagnostic UI"
            git push origin HEAD:main
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
